# Every push to main and every pull request: lint and check formatting across the repo, then
# build, type-check every package and run the tests. The build comes before the type
# check because the api's check reads its dist/. Cloudflare deploys main on its own; this
# says whether what it deployed checks out.
name: Checks

on:
    push:
        branches: [main]
    pull_request:

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            # pnpm's version comes from packageManager in package.json.
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec eslint --flag v10_config_lookup_from_file .
            - run: pnpm exec prettier --check .
            - run: pnpm build
            - run: node scripts/typecheck.mjs --all
            - run: pnpm test
