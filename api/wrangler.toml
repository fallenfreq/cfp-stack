# The Pages project's settings (docs/hosting.md). The format:
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

# Not the Pages project's name, which is cfp-stack (docs/hosting.md, "The Pages project").
name = "somefreq-pages"
pages_build_output_dir = "./client_dist"
# not needed for cloudflare pages, just workers
# main = "src/app.ts"
compatibility_date = "2024-08-29"
# will slow down cold starts
compatibility_flags = [
  "nodejs_compat"
]

upload_source_maps = true


[[d1_databases]]
binding = "DB" # Makes the database available in the pages functions via env.DB
database_name = "somefreq-db"
database_id = "7f2fdab4-d3c2-4418-860b-c9f8817ddbd1"
migrations_dir = "migrations"
# drizzle-kit writes each migration as a folder (wrangler 4.98 and later read it)
migrations_pattern = "migrations/*/migration.sql"

# What each one is, and where the secrets are: docs/hosting.md, "Settings".
[vars]
NODE_VERSION = "24"
# Mail, unused yet.
SMTP_OUT_SERVER = "smtppro.zoho.eu"
SMTP_OUT_PORT_TLS = "587"
# Signing in (docs/auth.md, "Settings").
OIDC_ISSUER = "https://somefreq-instance-45dyjl.zitadel.cloud"
OIDC_CLIENT_ID = "393641495095256560"
APP_ORIGINS = "https://somefreq.com"
ZITADEL_PROJECT_ID = "282310388651981429"